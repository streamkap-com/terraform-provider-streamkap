# Docs drift check — fails a PR when docs/ no longer match the committed schemas.
#
# Why: `go generate ./...` runs tfplugindocs BEFORE tfgen, so a regen done that way
# ships a new schema field in internal/generated/*.go while docs/resources/*.md lag a
# regen behind (this shipped in beta.18 and was caught by a customer). This job
# re-renders docs from the *committed* schemas (no backend needed) and fails if anything
# changes — i.e. the committed docs are stale relative to the committed schemas.
name: Docs Drift

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - internal/**
      - docs/**
      - templates/**
      - examples/**
      - main.go
      - go.mod

permissions:
  contents: read

jobs:
  docs-drift:
    name: Docs match committed schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      # `go generate main.go` runs main.go's own directives, so this check can never
      # drift from the flags `make generate` uses (tfplugindocs derives the provider
      # name from the checkout directory unless told otherwise).
      - name: Render docs from committed schemas
        run: go generate main.go

      - name: Fail if docs drifted
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all -- docs/)" ]; then
            git diff -- docs/
            git status --short --untracked-files=all -- docs/
            echo "::error::docs/ is stale relative to the committed schemas in internal/generated/."
            echo "Run 'make generate' (never 'go generate ./...') and commit the regenerated docs."
            exit 1
          fi
          echo "docs/ matches the committed schemas."
