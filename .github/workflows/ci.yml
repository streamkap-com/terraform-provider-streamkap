# Core CI gate — build, vet, lint and the credential-free test tiers.
#
# This is the workflow that makes the repo's local guards actually binding. The
# schema snapshots (TestSchemaBackwardsCompatibility, TestEveryResourceHasSchemaSnapshot),
# the deprecated-alias target check (TestDeprecatedAliasTargetsExist) and the validator
# tests are the drift-detection system CLAUDE.md leans on; before this workflow existed
# none of them ran on a pull request, so a hand-edit to internal/generated/ flipping a
# Sensitive flag off — or a PR that simply did not compile — could merge green.
#
# Everything here is credential-free, so it runs on fork PRs too (pr-acceptance.yml,
# which needs the 1Password service-account token, skips those entirely).
name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Belt and braces. resource.Test only self-skips while TF_ACC is empty, and the
  # test tiers below are meant to touch no API at all. `make test` clears TF_ACC
  # itself, but `test-schema` and `test-validators` do not — so pin it empty for the
  # whole workflow and a stray value can never turn this gate into a live-API run.
  TF_ACC: ""

jobs:
  build:
    name: Build, vet and credential-free tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # provider_config_test.go drives resource.UnitTest cases. UnitTest sets TF_ACC
      # for its own duration and shells out to a real terraform binary, so the "unit"
      # tier needs terraform on PATH even though it reaches no API.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.16.1'
          terraform_wrapper: false # Required for the Go tests

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Unit (-short) + schema-compat + validators. See GNUmakefile: `test` clears
      # TF_ACC and runs -short across all packages; the other two are -run filtered.
      - name: Unit, schema-compat and validator tests
        run: make test-all

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # golangci-lint-action manages its own cache

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2

  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Upstream PR #654 adds GitHub concurrency.queue support; v1.7.12 rejects it.
      - name: Validate workflows
        run: |
          set -euo pipefail
          actionlint_source="$RUNNER_TEMP/actionlint"
          git init -q "$actionlint_source"
          git -C "$actionlint_source" remote add origin https://github.com/rhysd/actionlint.git
          git -C "$actionlint_source" fetch --quiet --depth=1 origin 644076a59742c2d1540ebd4686eab3c308f0e562
          git -C "$actionlint_source" checkout --quiet --detach FETCH_HEAD
          go build -C "$actionlint_source" -o "$RUNNER_TEMP/actionlint-bin" ./cmd/actionlint
          "$RUNNER_TEMP/actionlint-bin"
