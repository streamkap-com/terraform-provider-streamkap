# Security scanning workflow for Terraform provider.
name: Security Scan

# Run security scans on all pushes and pull requests.
on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  govulncheck:
    name: Go vulnerability analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@99bb2caf247dfd9f03cf984373bc6043d4e32ebf # v12.1347.0
        with:
          directory: examples/
          framework: terraform
          quiet: true
          soft_fail: false

  # Secret scanning. This repo is public, and contributors keep live connector
  # credentials in a gitignored env.md next to the tree — one `git add -f` (or a
  # .gitignore refactor) away from a public disclosure. Trivy and Checkov scan for CVEs
  # and Terraform misconfigurations; neither looks for credentials.
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The gitleaks CLI, not gitleaks/gitleaks-action: the action requires a paid
      # GITLEAKS_LICENSE for repositories owned by a GitHub organization, and would fail
      # closed here until someone provisions one. The CLI is MIT and needs no secret.
      # Pinned by version and verified by checksum — the same intent as SHA-pinning an
      # action.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          rm -f gitleaks.tar.gz

      # Scans the checked-out tree, not the full git history. The job of this gate is to
      # stop a new secret from landing; pre-v3 history has its own findings that need
      # triage and credential rotation, and blocking every PR on them would only get the
      # gate switched off. --redact keeps any match out of the public build log.
      - name: Scan for committed secrets
        run: ./gitleaks dir . --redact --no-banner --verbose
