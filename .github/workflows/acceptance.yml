# Acceptance tests workflow - runs against real Streamkap API
name: Acceptance Tests

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 2 * * *'  # Nightly at 2 AM UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance-tests:
    name: Acceptance Tests (TF ${{ matrix.terraform-version }})
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    concurrency:
      group: streamkap-staging-fixtures
      cancel-in-progress: false
      queue: max
    environment: staging
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1  # Serialize to avoid API conflicts
      matrix:
        # A push runs the newest Terraform only. The job holds the shared
        # staging-fixture concurrency group for its whole matrix, so the full
        # six-version sweep on every main merge would block PR acceptance
        # for hours. The nightly schedule and manual dispatch still run all of them.
        terraform-version: ${{ (github.event_name == 'push' && fromJSON('["1.16.1"]')) || fromJSON('["1.0.11", "1.8.5", "1.9.8", "1.10.5", "1.11.4", "1.16.1"]') }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.terraform-version }}
          terraform_wrapper: false  # Required for Go tests

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Load env.json from 1Password
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          # OP_ENV_REF holds the op://<vault>/<item>/<field> reference so internal
          # vault and item names stay out of this public repo.
          STREAMKAP_ENV_JSON: ${{ secrets.OP_ENV_REF }}

      - name: Export credentials into the job environment
        run: |
          set -euo pipefail
          if [ -z "${STREAMKAP_ENV_JSON:-}" ]; then
            echo "STREAMKAP_ENV_JSON is empty — check the op:// reference and the vault item." >&2
            exit 1
          fi
          printf '%s' "$STREAMKAP_ENV_JSON" | jq -e 'type == "object"' >/dev/null \
            || { echo "env.json must be a flat JSON object of {\"VAR\": \"value\"}." >&2; exit 1; }

          # Values may be multiline (PEM keys), so use the heredoc form of
          # $GITHUB_ENV and mask every value line.
          while IFS= read -r key; do
            value="$(printf '%s' "$STREAMKAP_ENV_JSON" | jq -r --arg k "$key" '.[$k]')"
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::add-mask::$line"
            done <<< "$value"
            delim="EOF_$(printf '%s' "$key" | tr -c 'A-Za-z0-9' '_')"
            {
              echo "${key}<<${delim}"
              printf '%s\n' "$value"
              echo "${delim}"
            } >> "$GITHUB_ENV"
          done < <(printf '%s' "$STREAMKAP_ENV_JSON" | jq -r 'keys[]')

          count="$(printf '%s' "$STREAMKAP_ENV_JSON" | jq -r 'keys | length')"
          echo "Exported $count credential variables from env.json."

      - name: Run Acceptance Tests
        env:
          TF_ACC: '1'
        run: |
          gotestsum --jsonfile acceptance-results-${{ matrix.terraform-version }}.json \
            --junitfile acceptance-results-${{ matrix.terraform-version }}.xml \
            -- -count=1 -v -timeout 120m -parallel 2 \
            -run 'TestAcc' ./internal/provider/...

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: acceptance-results-tf-${{ matrix.terraform-version }}
          path: |
            acceptance-results-*.json
            acceptance-results-*.xml
