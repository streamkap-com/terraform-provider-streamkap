# Terraform Provider release workflow.
name: Release

# This GitHub action creates a release when a tag that matches the pattern
# "v*" (e.g. v0.1.0) is created.
on:
  push:
    tags:
      - "v*"

# Default to read-only; the publishing job widens to contents: write for itself.
permissions:
  contents: read

env:
  TF_ACC: ""

jobs:
  # Pushing a tag used to be sufficient to publish a signed public release: goreleaser
  # ran with no build, no tests and no changelog check, so a `git push --tags` from a
  # stale local branch could ship a commit that nothing had ever compiled. These checks
  # are credential-free and take about a minute; goreleaser now `needs:` them.
  preflight:
    name: Preflight (build, tests, changelog)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version-file: "go.mod"
          cache: true

      # The -short tier includes resource.UnitTest cases, which shell out to a real
      # terraform binary.
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: '1.11.*'
          terraform_wrapper: false

      # CHANGELOG.md headings look like `## [3.0.0-beta.25] - 2026-07-10 (Pre-release)`,
      # so the tag's version must appear as a bracketed heading. Catches the classic
      # "tagged before writing the changelog entry" release.
      - name: Tag version is documented in CHANGELOG.md
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if ! grep -qF "[${version}]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no [${version}] entry for tag ${GITHUB_REF_NAME}."
            echo "Add the release section to CHANGELOG.md, then re-tag."
            exit 1
          fi
          echo "CHANGELOG.md documents ${version}."

      - name: Build
        run: go build ./...

      - name: Unit, schema-compat and validator tests
        run: make test-all

  goreleaser:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      # Creating a release and uploading assets counts as writing contents.
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Allow goreleaser to access older tag information.
          fetch-depth: 0
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version-file: "go.mod"
          cache: true
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@cb9bde2e2525e640591a934b1fd28eef1dcaf5e5 # v6.2.0
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@90a3faa9d0182683851fbfa97ca1a2cb983bfca3 # v6.2.1
        with:
          args: release --clean
        env:
          # GitHub sets the GITHUB_TOKEN secret automatically.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
