# Migration tests workflow - validates old→new provider equivalence
# TEMPORARY: Delete this file after v3.0.0 release validation.
name: Migration Tests

on:
  pull_request:
    branches:
      - main
      - develop
    types: [opened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-tests:
    name: Migration Validation (v2.2.0 → New)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false)
    concurrency:
      group: streamkap-staging-fixtures
      cancel-in-progress: false
      queue: max
    environment: staging
    timeout-minutes: 190

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.16.1'
          terraform_wrapper: false

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      # Credentials come from the same single env.json blob in 1Password that
      # pr-acceptance.yml uses. This job previously read repo secrets named
      # STREAMKAP_CLIENT_ID / STREAMKAP_SECRET directly; those do not exist, so
      # every migration case that does not self-skip failed with
      # "Missing Streamkap API client_id" before reaching any provider code.
      - name: Load env.json from 1Password
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          # OP_ENV_REF holds the op://<vault>/<item>/<field> reference so internal
          # vault and item names stay out of this public repo.
          STREAMKAP_ENV_JSON: ${{ secrets.OP_ENV_REF }}

      - name: Export credentials into the job environment
        run: |
          set -euo pipefail
          if [ -z "${STREAMKAP_ENV_JSON:-}" ]; then
            echo "STREAMKAP_ENV_JSON is empty — check the op:// reference and the vault item." >&2
            exit 1
          fi
          printf '%s' "$STREAMKAP_ENV_JSON" | jq -e 'type == "object"' >/dev/null \
            || { echo "env.json must be a flat JSON object of {\"VAR\": \"value\"}." >&2; exit 1; }

          # Values may be multiline (PEM keys), so use the heredoc form of
          # $GITHUB_ENV and mask every value line.
          while IFS= read -r key; do
            value="$(printf '%s' "$STREAMKAP_ENV_JSON" | jq -r --arg k "$key" '.[$k]')"
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::add-mask::$line"
            done <<< "$value"
            delim="EOF_$(printf '%s' "$key" | tr -c 'A-Za-z0-9' '_')"
            {
              echo "${key}<<${delim}"
              printf '%s\n' "$value"
              echo "${delim}"
            } >> "$GITHUB_ENV"
          done < <(printf '%s' "$STREAMKAP_ENV_JSON" | jq -r 'keys[]')

          count="$(printf '%s' "$STREAMKAP_ENV_JSON" | jq -r 'keys | length')"
          echo "Exported $count credential variables from env.json."

      - name: Run Migration Tests
        env:
          TF_ACC: '1'
        run: |
          gotestsum --jsonfile migration-results.json \
            --junitfile migration-results.xml \
            -- -v -timeout 180m \
            -run 'TestAcc.*Migration' ./internal/provider/...

      - name: Check for behavioral differences
        if: failure()
        run: |
          {
            echo "## Migration Test Failure"
            echo ""
            echo "Migration validation did not complete successfully. Inspect the job errors before attributing the failure to provider behavior."
            echo ""
            echo "### Failed Tests:"
            if [ -f migration-results.json ]; then
              jq -r 'select(.Action == "fail" and .Test != null) | "- \(.Test)"' migration-results.json
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: migration-test-results
          path: |
            migration-results.json
            migration-results.xml
