# Migration tests workflow - validates old→new provider equivalence
# TEMPORARY: Delete this file after v3.0.0 release validation.
name: Migration Tests

on:
  pull_request:
    branches:
      - main
      - develop
    types: [opened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-tests:
    name: Migration Validation (v2.2.0 → New)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false)
    concurrency:
      group: streamkap-staging-fixtures
      cancel-in-progress: false
      queue: max
    environment: staging
    timeout-minutes: 190

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.16.1'
          terraform_wrapper: false

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Run Migration Tests
        env:
          TF_ACC: '1'
          STREAMKAP_CLIENT_ID: ${{ secrets.STREAMKAP_CLIENT_ID }}
          STREAMKAP_SECRET: ${{ secrets.STREAMKAP_SECRET }}
          STREAMKAP_HOST: ${{ secrets.STREAMKAP_HOST }}
          TF_VAR_source_postgresql_hostname: ${{ secrets.TF_VAR_SOURCE_POSTGRESQL_HOSTNAME }}
          TF_VAR_source_postgresql_password: ${{ secrets.TF_VAR_SOURCE_POSTGRESQL_PASSWORD }}
        run: |
          gotestsum --jsonfile migration-results.json \
            --junitfile migration-results.xml \
            -- -v -timeout 180m \
            -run 'TestAcc.*Migration' ./internal/provider/...

      - name: Check for behavioral differences
        if: failure()
        run: |
          {
            echo "## Migration Test Failure"
            echo ""
            echo "Migration validation did not complete successfully. Inspect the job errors before attributing the failure to provider behavior."
            echo ""
            echo "### Failed Tests:"
            if [ -f migration-results.json ]; then
              jq -r 'select(.Action == "fail" and .Test != null) | "- \(.Test)"' migration-results.json
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: migration-test-results
          path: |
            migration-results.json
            migration-results.xml
